name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid redundant runs: cancel in-progress runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Format, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check (astro check)
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Pooled Neon connection string (production branch); the data
          # layer reads players, tasks and scores from it at build time.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
